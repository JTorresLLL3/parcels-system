# Puerto del Microservicio Base
server.port=8081

# Nombre de la aplicación
spring.application.name=parcel-base-service

# Configuración de Conexión a PostgreSQL Local
spring.datasource.url=jdbc:postgresql://localhost:5432/parcel_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Formato JSON de Respuestas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC
